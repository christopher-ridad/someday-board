<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Someday Board</title>

<!-- PWA: installable app manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8C9B65">
<meta name="description" content="A scrapbook wall for the things you keep putting off.">

<!-- iOS home-screen install support (Safari doesn't read the manifest for these) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Someday">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Android/Chrome home-screen icon -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">SENIOR YEAR</div>
    <h1 class="title">Someday Board</h1>
    <p class="subtitle" id="subtitleText">Loading...</p>
  </header>

  <main>
    <section class="screen active" id="screen-wheel">
      <div id="wheelArea"></div>
    </section>

    <section class="screen" id="screen-list">
      <div class="add-row">
        <input type="text" id="newItemInput" placeholder="Something you keep putting off..." maxlength="80">
        <button id="addItemBtn">+</button>
      </div>
      <div id="pendingList"></div>
    </section>

    <section class="screen" id="screen-memories">
      <div class="stat-row" id="statRow"></div>
      <div class="section-label">MEMORIES</div>
      <div id="memoriesGrid"></div>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" data-tab="wheel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><line x1="12" y1="12" x2="12" y2="20"/></svg>
      Board
    </button>
    <button class="nav-btn" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>
      List
    </button>
    <button class="nav-btn" data-tab="memories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6l1.5-2.5h5L16 6"/><circle cx="12" cy="13" r="3.2"/></svg>
      Memories
    </button>
  </nav>
</div>

<div class="modal-backdrop" id="memoryModalBackdrop">
  <div class="modal">
    <button class="close-x" id="closeMemoryModal">&times;</button>
    <h2 id="memoryModalTitle">Log this memory</h2>
    <p class="modal-sub" id="memoryModalSub"></p>
    <label class="photo-upload" id="photoUploadLabel">
      <span id="photoUploadHint">📷 Add a photo</span>
      <input type="file" accept="image/*" id="photoInput">
    </label>
    <textarea id="memoryNote" placeholder="How did it go? What happened?"></textarea>
    <div class="rating-row" id="ratingRow"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelMemory">Cancel</button>
      <button class="btn btn-primary" id="saveMemory">Save memory</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="detailModalBackdrop">
  <div class="modal detail-view">
    <button class="close-x" id="closeDetailModal">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script type="module" src="js/app.js"></script>
<script src="js/sw-register.js"></script>
</body>
</html>
